<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>تقرير التقييم | معهد العصر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css?v=2">
<link rel="stylesheet" href="assets/report.css?v=2">
</head>
<body>
<div class="toolbar no-print" id="toolbar">
  <div class="toolbar-inner">
    <strong class="tb-title">تقرير التقييم</strong>
    <label class="tb-field">
      <span>التقرير</span>
      <select id="scope"></select>
    </label>
    <button class="tb-btn" id="printBtn" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 9V3h10v6M7 17H4v-6a2 2 0 012-2h12a2 2 0 012 2v6h-3M7 14h10v7H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      حفظ PDF
    </button>
  </div>
</div>

<div class="login no-print" id="login" hidden>
  <form class="login-card" id="loginForm">
    <div class="login-logo" id="loginLogo"></div>
    <h1>تقرير التقييم</h1>
    <p>أدخلي كلمة سر التقرير</p>
    <input type="password" id="key" autocomplete="current-password" required>
    <button type="submit" class="tb-btn">دخول</button>
    <p class="login-err" id="loginErr" role="alert"></p>
  </form>
</div>

<div class="print-band" aria-hidden="true"></div>
<div id="doc" class="doc"></div>

<script src="config.js?v=3"></script>
<script src="common.js?v=2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="assets/report.js?v=3"></script>
</body>
</html>
